<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Gallery — Captured by Sienna</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#f7f4ef; --bg2:#efe9e1; --ink:#2b2622; --soft:#6b635b; --accent:#a9886b; --line:#ddd4c8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Inter",system-ui,sans-serif; color:var(--ink); background:var(--bg);
    line-height:1.6; font-weight:300; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  header.top { border-bottom:1px solid var(--line); background:rgba(247,244,239,.9); backdrop-filter:blur(8px);
    position:sticky; top:0; z-index:10; }
  header.top .in { max-width:1200px; margin:0 auto; padding:16px 26px; display:flex; justify-content:space-between; align-items:center; }
  .brand { font-family:"Cormorant Garamond",serif; font-size:1.4rem; letter-spacing:.04em; }
  .hero { text-align:center; padding:64px 26px 40px; }
  .hero .eyebrow { font-size:.7rem; letter-spacing:.26em; text-transform:uppercase; color:var(--accent); font-weight:500; }
  .hero h1 { font-family:"Cormorant Garamond",serif; font-weight:300; font-size:clamp(2.4rem,6vw,4rem); margin-top:8px; }
  .hero .date { color:var(--soft); margin-top:8px; font-size:.9rem; letter-spacing:.04em; }
  .dl-all { display:inline-block; margin-top:26px; padding:14px 34px; border:1px solid var(--ink);
    border-radius:40px; font-size:.76rem; letter-spacing:.16em; text-transform:uppercase;
    background:var(--ink); color:var(--bg); cursor:pointer; font-family:inherit;
    transition:background .25s, border-color .25s; }
  .dl-all:hover:not(:disabled) { background:var(--accent); border-color:var(--accent); }
  .dl-all:disabled { opacity:.65; cursor:default; }
  .dl-note { margin-top:10px; font-size:.8rem; color:var(--soft); min-height:1.2em; }
  .grid { max-width:1200px; margin:0 auto; padding:20px 20px 80px;
    columns:3; column-gap:14px; }
  .grid figure { break-inside:avoid; margin-bottom:14px; position:relative; overflow:hidden;
    border-radius:4px; background:var(--bg2); cursor:zoom-in; }
  .grid img { width:100%; display:block; transition:transform .4s; }
  .grid figure:hover img { transform:scale(1.03); }
  @media (max-width:820px){ .grid { columns:2; } }
  @media (max-width:520px){ .grid { columns:1; } }
  .msg { text-align:center; padding:120px 26px; color:var(--soft); font-family:"Cormorant Garamond",serif; font-size:1.4rem; }
  /* lightbox */
  .lb { position:fixed; inset:0; background:rgba(20,17,14,.94); display:none; z-index:100;
    align-items:center; justify-content:center; flex-direction:column; }
  .lb.open { display:flex; }
  .lb img { max-width:92vw; max-height:82vh; border-radius:4px; }
  .lb .ctrl { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
    padding:18px 22px; color:#f7f4ef; }
  .lb .ctrl a, .lb .ctrl button { color:#f7f4ef; background:none; border:1px solid rgba(247,244,239,.4);
    border-radius:40px; padding:8px 18px; font:inherit; font-size:.78rem; letter-spacing:.1em; text-transform:uppercase;
    cursor:pointer; }
  .lb .ctrl a:hover, .lb .ctrl button:hover { background:rgba(247,244,239,.15); }
  .lb .nav { position:absolute; top:50%; transform:translateY(-50%); font-size:2.4rem; color:#f7f4ef;
    background:none; border:none; cursor:pointer; padding:20px; opacity:.7; }
  .lb .nav:hover { opacity:1; }
  .lb .prev { left:8px; } .lb .next { right:8px; }
  footer { text-align:center; padding:40px 26px; border-top:1px solid var(--line); color:var(--soft); font-size:.82rem; }
  footer a { color:var(--accent); }
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="index.html">Captured by Sienna</a>
  <a class="brand" style="font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)" href="index.html">Portfolio →</a>
</div></header>

<div id="content"><div class="msg">Loading gallery…</div></div>

<div class="lb" id="lb">
  <div class="ctrl">
    <a id="lb-download" download>Download</a>
    <button id="lb-close">Close ✕</button>
  </div>
  <button class="nav prev" id="lb-prev">‹</button>
  <img id="lb-img" alt="" />
  <button class="nav next" id="lb-next">›</button>
</div>

<footer>
  © <span id="yr"></span> Captured by Sienna · Marion, NY ·
  <a href="index.html">View portfolio</a>
</footer>

<script>
const GH = { owner: "atm9729rit", repo: "captured-by-sienna", branch: "main" };
const $ = s => document.querySelector(s);
$("#yr").textContent = new Date().getFullYear();

const slug = new URLSearchParams(location.search).get("g");
const base = "galleries/" + (slug || "");
let PHOTOS = [], idx = 0;

function fail(msg) { $("#content").innerHTML = '<div class="msg">' + msg + '</div>'; }

async function load() {
  if (!slug || !/^[a-z0-9-]+$/.test(slug)) return fail("Gallery not found.");
  let meta;
  try {
    const r = await fetch(base + "/gallery.json", { cache: "no-store" });
    if (!r.ok) throw 0;
    meta = await r.json();
  } catch (e) { return fail("This gallery isn’t available yet.<br>If it was just created, check back in a minute."); }

  PHOTOS = (meta.photos || []).map(p => base + "/" + p.name);
  const dateStr = meta.date ? new Date(meta.date + "T00:00").toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" }) : "";
  let html = '<div class="hero"><p class="eyebrow">Your Gallery</p><h1>' + escapeHtml(meta.title || "Gallery") + '</h1>' +
    (dateStr ? '<p class="date">' + dateStr + '</p>' : '') +
    '<div><button class="dl-all" id="dl-all">Download all photos</button>' +
    '<p class="dl-note" id="dl-note"></p></div>' +
    '</div><div class="grid" id="grid"></div>';
  $("#content").innerHTML = html;
  const grid = $("#grid");
  PHOTOS.forEach((src, i) => {
    const fig = document.createElement("figure");
    const img = new Image(); img.src = src; img.loading = "lazy"; img.alt = "";
    fig.appendChild(img); fig.onclick = () => openLb(i); grid.appendChild(fig);
  });
  if (!PHOTOS.length) return fail("This gallery is empty.");
  $("#dl-all").onclick = () => downloadAll(meta.title || slug);
}

// ---- Download all as a ZIP (built in-browser, no library) ----
// JPEGs are already compressed, so entries are stored uncompressed (method 0).
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(entries) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  // DOS date/time for "now"
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();

  for (const e of entries) {
    const name = enc.encode(e.name);
    const crc = crc32(e.data), size = e.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, e.data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint16(8, 0, true); cd.setUint16(10, 0, true); cd.setUint16(12, dosTime, true);
    cd.setUint16(14, dosDate, true); cd.setUint32(16, crc, true);
    cd.setUint32(20, size, true); cd.setUint32(24, size, true);
    cd.setUint16(28, name.length, true); cd.setUint16(30, 0, true); cd.setUint16(32, 0, true);
    cd.setUint16(34, 0, true); cd.setUint16(36, 0, true); cd.setUint32(38, 0, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdStart = offset;
  let cdSize = 0; central.forEach(c => cdSize += c.length);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true); eocd.setUint16(4, 0, true); eocd.setUint16(6, 0, true);
  eocd.setUint16(8, entries.length, true); eocd.setUint16(10, entries.length, true);
  eocd.setUint32(12, cdSize, true); eocd.setUint32(16, cdStart, true); eocd.setUint16(20, 0, true);

  return new Blob([...chunks, ...central, new Uint8Array(eocd.buffer)], { type: "application/zip" });
}
async function downloadAll(title) {
  const btn = $("#dl-all"), note = $("#dl-note");
  btn.disabled = true;
  try {
    const entries = [];
    for (let i = 0; i < PHOTOS.length; i++) {
      note.textContent = "Preparing " + (i + 1) + " of " + PHOTOS.length + "…";
      const r = await fetch(PHOTOS[i]);
      if (!r.ok) throw new Error("Could not fetch photo " + (i + 1));
      entries.push({
        name: String(i + 1).padStart(3, "0") + ".jpg",
        data: new Uint8Array(await r.arrayBuffer())
      });
    }
    note.textContent = "Building zip file…";
    const blob = makeZip(entries);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (title || "gallery").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") + "-photos.zip";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    note.textContent = PHOTOS.length + " photos downloaded.";
  } catch (e) {
    note.textContent = "Download failed. Try again, or save photos individually.";
  } finally {
    btn.disabled = false;
  }
}
function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

// lightbox
const lb = $("#lb");
function openLb(i){ idx=i; render(); lb.classList.add("open"); document.body.style.overflow="hidden"; }
function closeLb(){ lb.classList.remove("open"); document.body.style.overflow=""; }
function render(){ const src=PHOTOS[idx]; $("#lb-img").src=src; const dl=$("#lb-download");
  dl.href=src; dl.download=(slug||"photo")+"-"+String(idx+1).padStart(3,"0")+".jpg"; }
function step(d){ idx=(idx+d+PHOTOS.length)%PHOTOS.length; render(); }
$("#lb-close").onclick=closeLb; $("#lb-prev").onclick=e=>{e.stopPropagation();step(-1);};
$("#lb-next").onclick=e=>{e.stopPropagation();step(1);};
lb.onclick=e=>{ if(e.target===lb) closeLb(); };
document.addEventListener("keydown",e=>{ if(!lb.classList.contains("open"))return;
  if(e.key==="Escape")closeLb(); if(e.key==="ArrowLeft")step(-1); if(e.key==="ArrowRight")step(1); });

load();
</script>
</body>
</html>
